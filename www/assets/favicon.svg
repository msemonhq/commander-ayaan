<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <!-- Deep Celestial Indigo Gradient -->
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A1E"/>
      <stop offset="45%" stop-color="#10163C"/>
      <stop offset="85%" stop-color="#0E1334"/>
      <stop offset="100%" stop-color="#080B20"/>
    </linearGradient>

    <!-- Nebula Glow -->
    <radialGradient id="nebulaGrad" cx="66%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#28367E" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#182052" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#182052" stop-opacity="0"/>
    </radialGradient>

    <!-- Solar Ambient Bloom -->
    <radialGradient id="sunBloom" cx="35%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FF7043" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun Disc Radial Gradient -->
    <radialGradient id="sunDisc" cx="32%" cy="58%" r="14%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="25%" stop-color="#FFF59D"/>
      <stop offset="55%" stop-color="#FFCA28"/>
      <stop offset="82%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </radialGradient>

    <!-- Earth Base Gradient -->
    <radialGradient id="earthGrad" cx="27%" cy="36%" r="7%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="50%" stop-color="#1E88E5"/>
      <stop offset="85%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </radialGradient>

    <!-- Orbi Body Gradient -->
    <linearGradient id="orbiBody" x1="56" y1="32" x2="76" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E1E7FB"/>
      <stop offset="100%" stop-color="#B0BAE8"/>
    </linearGradient>

    <!-- Thruster Glow -->
    <radialGradient id="thrusterGrad" cx="66" cy="56" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#70D6FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4FC3F7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#70D6FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Glows -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="earthClip">
      <circle cx="27" cy="35" r="6.4"/>
    </clipPath>
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="108" height="108" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- Background Space Canvas (Squircle Card) -->
  <g clip-path="url(#squircleClip)">
    <rect width="108" height="108" fill="url(#spaceGrad)"/>
    <circle cx="70" cy="38" r="50" fill="url(#nebulaGrad)"/>
    <circle cx="38" cy="65" r="46" fill="url(#sunBloom)"/>

    <!-- Background Stars -->
    <circle cx="14" cy="18" r="1.2" fill="#D0D6F5" opacity="0.6"/>
    <circle cx="94" cy="16" r="1.4" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="98" cy="76" r="1.3" fill="#FFD54F" opacity="0.75"/>
    <circle cx="15" cy="92" r="1.2" fill="#D0D6F5" opacity="0.6"/>
    <circle cx="88" cy="92" r="1.3" fill="#70D6FF" opacity="0.7"/>

    <!-- Diamond Stars -->
    <path d="M49,19.2 Q49,23 52.8,23 Q49,23 49,26.8 Q49,23 45.2,23 Q49,23 49,19.2 Z" fill="#FFF9C4" filter="url(#goldGlow)"/>
    <path d="M79,56.8 Q79,60 82.2,60 Q79,60 79,63.2 Q79,60 75.8,60 Q79,60 79,56.8 Z" fill="#E1F5FE" filter="url(#cyanGlow)"/>
    <path d="M24,51.2 Q24,54 26.8,54 Q24,54 24,56.8 Q24,54 21.2,54 Q24,54 24,51.2 Z" fill="#FFE082"/>

    <!-- Stardust -->
    <circle cx="35" cy="25" r="1.0" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="60" cy="18" r="1.1" fill="#FFD54F" opacity="0.65"/>
    <circle cx="83" cy="38" r="1.0" fill="#70D6FF" opacity="0.6"/>
    <circle cx="44" cy="78" r="1.2" fill="#FFE082" opacity="0.6"/>
    <circle cx="63" cy="73" r="1.1" fill="#D0D6F5" opacity="0.55"/>

    <!-- Orbit Track -->
    <ellipse cx="45" cy="53" rx="31" ry="23" transform="rotate(-18 45 53)" fill="none" stroke="rgba(208, 214, 245, 0.38)" stroke-width="1.4" stroke-dasharray="4 4"/>

    <!-- Earth & Moon -->
    <!-- Atmosphere -->
    <circle cx="27" cy="35" r="8.2" fill="none" stroke="rgba(112, 214, 255, 0.45)" stroke-width="1.5"/>
    <!-- Globe -->
    <circle cx="27" cy="35" r="6.4" fill="url(#earthGrad)"/>
    <!-- Continents & Clouds (Clipped) -->
    <g clip-path="url(#earthClip)">
      <ellipse cx="28.2" cy="36.5" rx="3.2" ry="2.4" transform="rotate(23 28.2 36.5)" fill="#43A047"/>
      <ellipse cx="24.8" cy="34.5" rx="2.0" ry="2.6" transform="rotate(-12 24.8 34.5)" fill="#43A047"/>
      <ellipse cx="27.8" cy="38.2" rx="2.2" ry="1.4" fill="#66BB6A"/>
      <path d="M26.5,33.5 A3.8,3.8 0 0,1 30.5,35" stroke="rgba(255, 255, 255, 0.75)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <path d="M25,37 A4.2,4.2 0 0,0 28,39" stroke="rgba(255, 255, 255, 0.75)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <!-- Shadow -->
      <path d="M20,28 L35,28 L27,42 L20,42 Z" fill="rgba(5, 10, 30, 0.55)"/>
    </g>
    <!-- Moon -->
    <circle cx="20" cy="42" r="1.7" fill="#B0BEC5"/>

    <!-- The Sun -->
    <!-- Corona Ring 1 -->
    <circle cx="38" cy="65" r="18" fill="rgba(255, 193, 7, 0.28)"/>
    <!-- Corona Ring 2 -->
    <circle cx="38" cy="65" r="16" fill="rgba(255, 160, 0, 0.36)"/>
    <!-- Sun Disc -->
    <circle cx="38" cy="65" r="14.5" fill="url(#sunDisc)" filter="url(#goldGlow)"/>
    <!-- Inner Rim Highlight -->
    <path d="M25,65 A13.8,13.8 0 0,1 38,51.2" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.1" fill="none"/>

    <!-- Orbi Companion Robot -->
    <!-- Thruster -->
    <circle cx="66" cy="56" r="7" fill="url(#thrusterGrad)"/>
    <!-- Antenna -->
    <line x1="66" y1="32" x2="66" y2="25.5" stroke="#D0D6F5" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="66" cy="24.8" r="2.5" fill="#70D6FF" filter="url(#cyanGlow)"/>
    <!-- Left Arm (Waving) -->
    <path d="M56,44 Q51,39 52,35" stroke="#D0D6F5" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="52" cy="35" r="1.5" fill="#70D6FF"/>
    <!-- Right Arm -->
    <path d="M76,45 Q80,47 79,51" stroke="#D0D6F5" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="79" cy="51" r="1.4" fill="#70D6FF"/>
    <!-- Body Capsule -->
    <rect x="55.5" y="32" width="21" height="22" rx="10.5" ry="10.5" fill="url(#orbiBody)" stroke="#959FCE" stroke-width="1.4"/>
    <!-- Visor -->
    <rect x="58.2" y="38" width="15.6" height="10" rx="5" ry="5" fill="#0B0E28"/>
    <!-- Visor Glass Glint -->
    <path d="M60,39.5 A6,6 0 0,1 72,39.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="0.9" fill="none"/>
    <!-- Eyes -->
    <ellipse cx="62.5" cy="43.5" rx="1.9" ry="2.4" fill="#70D6FF" filter="url(#cyanGlow)"/>
    <ellipse cx="69.5" cy="43.5" rx="1.9" ry="2.4" fill="#70D6FF" filter="url(#cyanGlow)"/>
    <circle cx="62" cy="42.8" r="0.7" fill="#FFFFFF"/>
    <circle cx="69" cy="42.8" r="0.7" fill="#FFFFFF"/>

    <!-- Subtle Outer Border -->
    <rect x="1" y="1" width="106" height="106" rx="23" ry="23" fill="none" stroke="rgba(208, 214, 245, 0.22)" stroke-width="1.5"/>
  </g>
</svg>
